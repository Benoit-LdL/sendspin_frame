[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sendspin-frame"
version = "0.1.0"
description = "Sendspin player for Music Assistant with a now-playing / photo-frame screen, for Raspberry Pi OS Lite (no desktop needed)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Pinned: we extend the upstream daemon class, so upgrade deliberately and re-test.
    "sendspin==9.1.0",
    "pillow>=10.1",
    "numpy>=1.26",
    "aiohttp>=3.9",
]
keywords = ["music-assistant", "sendspin", "raspberry-pi", "photo-frame", "now-playing"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

[project.scripts]
sendspin-frame = "sendspin_frame.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["sendspin_frame"]

[tool.ruff]
line-length = 100
target-version = "py312"
